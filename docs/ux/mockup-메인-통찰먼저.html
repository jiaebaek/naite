<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나이테 · 통찰-먼저 메인 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1EA; --card:#FCFCF8; --border:#DDE3D6;
    --ink:#23291F; --secondary:#565E4E; --muted:#8B9182;
    --sage:#4F9A72; --sage-bg:#EAF3EC; --sage-ink:#2E6B4E;
    --honey-bg:#F7EEE3; --honey-ink:#7A4520; --honey-muted:#9A6A3C;
    --pine:#245648; --track:#E4E7DE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
  .serif{font-family:'Gowun Batang',serif}
  .frame{max-width:360px;width:100%;background:#e7e9e1;border-radius:20px;padding:10px}
  .screen{background:var(--card);border:0.5px solid var(--border);border-radius:14px;overflow:hidden}
  .hd{padding:14px 16px 10px;border-bottom:0.5px solid var(--border)}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-size:18px;color:var(--pine);font-weight:400}
  .tag{font-size:11px;color:var(--muted)}
  .kid{display:flex;align-items:center;gap:8px;margin-top:8px}
  .kid .nm{font-size:15px;font-weight:500}
  .chip{font-size:11px;color:var(--sage-ink);background:var(--sage-bg);padding:2px 8px;border-radius:999px}
  .hero{padding:18px 16px 14px;text-align:center}
  .hero .line{font-size:19px;line-height:1.4;color:var(--pine)}
  .hero .sub{font-size:13px;color:var(--secondary);margin-top:6px}
  .hero .auth{font-size:11px;color:var(--muted);margin-top:8px}
  .lanes{padding:0 16px 6px;display:flex;flex-direction:column;gap:10px}
  .lane{background:#F4F5F0;border-radius:10px;padding:10px 12px}
  .lane .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .lane .row b{font-weight:500}
  .lane .row span{color:var(--secondary)}
  .bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--sage)}
  .nudge{margin:8px 16px 4px;background:var(--honey-bg);border-radius:10px;padding:11px 12px}
  .nudge .t{font-size:12px;color:var(--honey-ink);font-weight:500;margin-bottom:2px}
  .nudge .d{font-size:13px}
  .nudge .m{font-size:11px;color:var(--honey-muted);margin-top:3px}
  .add{margin:6px 16px 14px;width:calc(100% - 32px);font-size:13px;color:var(--secondary);
    background:transparent;border:0.5px solid var(--border);border-radius:8px;padding:9px}
  .nav{display:flex;border-top:0.5px solid var(--border)}
  .nav div{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--muted)}
  .nav div.on{color:var(--pine)}
  .nav svg{display:block;margin:0 auto 2px}
</style>
</head>
<body>
<div class="frame">
<div class="screen">

  <div class="hd">
    <div class="brand"><b class="serif">나이테</b><span class="tag">나이에 맞게, 놓치지 않게</span></div>
    <div class="kid">
      <span class="nm">지호 · 만 5세 8개월</span>
      <span class="chip">✓ 유치원 다니는 중</span>
    </div>
  </div>

  <div class="hero">
    <svg width="112" height="112" viewBox="0 0 112 112" style="margin:0 auto 8px">
      <circle cx="56" cy="56" r="34" fill="none" stroke="#E4E7DE" stroke-width="11"/>
      <circle cx="56" cy="56" r="34" fill="none" stroke="#4F9A72" stroke-width="11" stroke-linecap="round" stroke-dasharray="186.9 213.6" transform="rotate(-90 56 56)"/>
      <text x="56" y="52" text-anchor="middle" font-size="22" font-weight="500" fill="#23291F">21</text>
      <text x="56" y="69" text-anchor="middle" font-size="11" fill="#8B9182">/ 24곳</text>
    </svg>
    <div class="line serif">이 시기 챙길 것,<br>대부분 잘 되고 있어요</div>
    <div class="sub">유치원·일상에서 대부분 챙겨지고 있어요</div>
    <div class="auth">🏅 아이 발달·교육 전문가들이 세운 기준으로 정리</div>
  </div>

  <div class="lanes">
    <div class="lane">
      <div class="row"><b>학습 · 국·영·수·과</b><span>우리 학원·집이 챙겨요</span></div>
      <div class="bar"><i style="width:62%"></i></div>
    </div>
    <div class="lane">
      <div class="row"><b>생활·마음</b><span>유치원·일상에서</span></div>
      <div class="bar"><i style="width:92%"></i></div>
    </div>
  </div>

  <div class="nudge">
    <div class="t">딱 하나 더 본다면 · 과학·탐구</div>
    <div class="d">산책하며 "이건 왜 그럴까?" 같이 궁금해하기 · 5분</div>
    <div class="m">급하지 않아요. 이 시기에 자연스럽게 하면 좋은 것.</div>
  </div>

  <button class="add">우리 애 학원 추가하면 더 정확해져요</button>

  <div class="nav">
    <div class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#245648" stroke-width="1.6"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>오늘</div>
    <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B9182" stroke-width="1.6"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>영역</div>
    <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B9182" stroke-width="1.6"><path d="M12 20v-7M12 13c0-3 2-5 5-5-.5 3-2 5-5 5zM12 13c0-3-2-5-5-5 .5 3 2 5 5 5z"/></svg>기록</div>
  </div>

</div>
</div>
</body>
</html>

# 나이테 — GitHub Pages 자동배포
# main 에 push 하면 빌드해서 https://jiaebaek.github.io/naite/ 로 배포한다.
#
# ⚠️ 최초 1회: 저장소 Settings → Pages → "Build and deployment" → Source 를
#    "GitHub Actions" 로 바꿔야 deploy 잡이 통과한다(클릭 한 번).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행도 허용

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않게 (마지막 것만)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages # base=/naite/ 로 빌드 (프로젝트 사이트 경로)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
